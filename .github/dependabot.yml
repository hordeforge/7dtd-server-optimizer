# Three dependency surfaces, one update entry each: the test project's NuGet
# packages (hash-pinned in packages.lock.json), the dotnet-coverage local tool
# manifest restored by `make coverage`, and the SHA-pinned CI actions.
# The main mod project declares no package: its game references resolve from
# the dedicated server's own Managed/ directory, so there is nothing to watch.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /Source/EfficientServer.Tests
      # dotnet-coverage, restored by `make coverage` and by the coverage-badge
      # job. The tool manifest is a fetch surface like any other: it ships
      # unpinned tooling into CI, so it gets the same weekly watch.
      - /.config
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
