name: release

# Tag-driven releases (hordeforge/.github REPOSITORY_STANDARDS.md, §8): a
# vX.Y.Z tag must agree with the version this repository actually ships, so a
# mistyped or forgotten bump is rejected instead of becoming a release nobody
# can reproduce.
#
# The mod archive is deliberately NOT built here. `make package` compiles
# against the dedicated server's own assemblies, which a hosted runner does
# not have; a maintainer with a game install runs `make package` and attaches
# the zip. Gating the tag is the half that can be proven automatically, and
# asserting the other half here would be a claim, not evidence.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    # Pinned image, same reason as ci.yml: a floating runner changes the
    # resolved glibc, the preinstalled tool set and the base image's own
    # supply chain under the gate, so a green tag check today can go red with
    # no change in this repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Same rationale as ci.yml: this job only reads the manifest, so the
        # checkout does not need to leave a token behind in the workspace.
        with:
          persist-credentials: false
      - name: Check the tag matches Source/EfficientServer/ModInfo.xml
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="Source/EfficientServer/ModInfo.xml"
          case "$TAG" in v*) ;; *) echo "ERROR: tag '$TAG' does not start with 'v'" >&2; exit 1;; esac
          SHIPPED="$(sed -n 's/.*<Version[^>]*value="\([^"]*\)".*/\1/p' "$MANIFEST" | head -1)"
          if [ -z "$SHIPPED" ]; then
            echo "ERROR: no <Version value=\"...\"> found in $MANIFEST" >&2
            exit 1
          fi
          if [ "$SHIPPED" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but $MANIFEST ships $SHIPPED; make them match before tagging" >&2
            exit 1
          fi
          echo "ok: tag $TAG matches $MANIFEST ($SHIPPED)"
      - name: Check the release notes cover the tagged version
        shell: bash
        run: |
          set -euo pipefail
          # The tag check above compares two files in the tree; the notes are a
          # third. check_version.py is the same gate `make test` runs, and it
          # fails when the newest CHANGELOG section is not the version the mod
          # ships, so a tag cannot go out with no notes, an undated section, or
          # one that documents a different release.
          python3 scripts/check_version.py
