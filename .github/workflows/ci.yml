name: ci
# Push runs cover direct commits to main; every PR gets exactly one run via
# pull_request, so pushing a PR branch no longer starts a duplicate second run
# under a different concurrency key.
on:
  push:
    branches: [main]
  pull_request:
# Read-only token: the test gate never needs write access to repo resources.
permissions:
  contents: read
concurrency:
  # Superseded runs on the same branch/PR are obsolete; cancel instead of queueing.
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  optimizer:
    runs-on: ubuntu-latest
    # A hung run must die instead of holding a runner for the 6h default.
    timeout-minutes: 15
    steps:
      # Actions pinned to the commit the mutable v4 tag currently names;
      # floating major tags are a supply-chain risk (reproducibility).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The gate performs no git operations; not persisting the token removes
        # it from the runner workspace entirely instead of trusting every step
        # with it for the job's lifetime.
        with:
          persist-credentials: false
      # SDK pinned by global.json (rollForward latestFeature); setup-dotnet
      # reads it when dotnet-version is omitted. Cache NuGet packages keyed
      # on the locked dependency graph so restore stops re-downloading.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          cache: true
          cache-dependency-path: Source/EfficientServer.Tests/packages.lock.json
      # Runners ship shellcheck + python3 but not ruff or mypy. Pinned to the
      # exact versions used locally so rule/checker behavior cannot diverge
      # between a green local run and a red remote one (and vice versa).
      # SHA-pinned like checkout/setup-dotnet above: a moved v5 tag must not be
      # able to inject code into the pipeline.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv tool install ruff==0.16.4
      - run: uv tool install mypy==2.1.0
      - run: make test

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: optimizer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Same rationale as the optimizer job: every authenticated git operation
      # below passes its own token URL explicitly, so the checkout's embedded
      # credential is not needed anywhere and is dropped from the workspace.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          cache: true
          cache-dependency-path: Source/EfficientServer.Tests/packages.lock.json
      # No ruff/mypy installs here: make coverage and coverage_badge.py touch
      # neither, unlike the optimizer job above.
      - run: make coverage
      - run: python3 scripts/coverage_badge.py TestResults/coverage.cobertura.xml "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Explicit token URL, not the workspace "origin": the checkout no
          # longer persists credentials, and this must work the same on a
          # private repo where an anonymous ls-remote would fail.
          if git ls-remote --exit-code --heads "$url" badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          git remote remove origin 2>/dev/null || true
          git remote add origin "$url"
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
