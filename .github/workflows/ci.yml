name: ci
on: [push, pull_request]
# Read-only token: the test gate never needs write access to repo resources.
permissions:
  contents: read
concurrency:
  # Superseded runs on the same branch/PR are obsolete; cancel instead of queueing.
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  optimizer:
    runs-on: ubuntu-latest
    # A hung run must die instead of holding a runner for the 6h default.
    timeout-minutes: 15
    steps:
      # Actions pinned to the commit the mutable v4 tag currently names;
      # floating major tags are a supply-chain risk (reproducibility).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # SDK pinned by global.json (rollForward latestFeature); setup-dotnet
        # reads it when dotnet-version is omitted. Cache NuGet packages keyed
        # on the locked dependency graph so restore stops re-downloading.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          cache: true
          cache-dependency-path: Source/EfficientServer.Tests/packages.lock.json
      - run: make test
