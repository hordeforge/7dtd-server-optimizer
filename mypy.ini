# Python type gate, wired into `make test` next to ruff and shellcheck.
# Flags are proven clean by a full run before being enabled here; a new flag
# must pass on the tree before it lands (same policy as ruff.toml's groups).
# Every non-default --strict flag is listed below, so this config is --strict
# spelled out: keep that in mind when bumping MYPY_VERSION, since a new
# strict-by-default flag only lands here after a clean run.
[mypy]
files = scripts
# Pinned analysis target: mypy otherwise follows the interpreter running it,
# so a 3.14 dev box and a 3.12 CI runner could disagree on checker behavior
# even with the tool version pinned (same rationale as the exact pins in the
# Makefile). Scripts must stay compatible with this floor; raise it only as a
# reviewed change alongside the runners.
python_version = 3.10
disallow_any_generics = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_any_unimported = True
no_implicit_optional = True
no_implicit_reexport = True
warn_return_any = True
strict_equality = True
extra_checks = True
disallow_subclassing_any = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
warn_unused_configs = True
# Opt-in error codes mypy ships but leaves off by default, all proven clean on
# this tree: possibly-undefined catches a name read before assignment,
# redundant-expr and truthy-bool catch conditions that are always true or
# always truthy (a silent refactor leftover), ignore-without-code keeps a bare
# `# type: ignore` from silencing every error on its line, and
# unused-awaitable / explicit-override keep async and virtual members honest.
# A new opt-in code only lands here after a clean run, same policy as above.
enable_error_code = possibly-undefined, redundant-expr, truthy-bool,
    ignore-without-code, unused-awaitable, explicit-override

# bloodmoon_profile lives only in the sibling 7dtd-loadgen tree and is made
# importable at runtime by harness_common.py's sys.path insert (see the E402
# exemption in ruff.toml for the same boundary). There is nothing to analyze
# here, only the import to accept.
[mypy-bloodmoon_profile]
ignore_missing_imports = True
