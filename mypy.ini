# Python type gate, wired into `make test` next to ruff and shellcheck.
# Flags are proven clean by a full run before being enabled here; a new flag
# must pass on the tree before it lands (same policy as ruff.toml's groups).
# Full --strict is not enabled yet: warn_return_any fires 5 times (Any leakage
# through the untyped loadgen boundary) and disallow_any_generics ~41 times,
# mostly bare `dict` generics in the live-server harnesses; tighten per-flag
# once those are resolved.
[mypy]
files = scripts
# Pinned analysis target: mypy otherwise follows the interpreter running it,
# so a 3.14 dev box and a 3.12 CI runner could disagree on checker behavior
# even with the tool version pinned (same rationale as the exact pins in the
# Makefile). Scripts must stay compatible with this floor; raise it only as a
# reviewed change alongside the runners.
python_version = 3.10
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
no_implicit_optional = True
strict_equality = True
extra_checks = True
disallow_subclassing_any = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

# bloodmoon_profile lives only in the sibling 7dtd-loadgen tree and is made
# importable at runtime by harness_common.py's sys.path insert (see the E402
# exemption in ruff.toml for the same boundary). There is nothing to analyze
# here, only the import to accept.
[mypy-bloodmoon_profile]
ignore_missing_imports = True
