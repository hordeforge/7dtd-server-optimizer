# Python lint gate, wired into `make test` and CI next to shellcheck, plus the
# formatter gate: `ruff format --check scripts` in the same target. Layout is
# the formatter's, not a reviewer's, so a wrapped call is never hand-tuned.
# Line length mirrors .editorconfig's repo-wide 100-column cap.
line-length = 100

# Harness scripts import each other directly from scripts/.
src = ["scripts"]

[lint]
# Groups proven clean by a full run before being enabled here; a new group
# must pass on the tree before its selector lands. Deliberately not selected:
# - T20 (print): these are CLI harnesses; stdout is the product.
# - BLE (blind except): every hit is a teardown or quarantine boundary that
#   must log-and-continue so a failed cleanup never masks the real result, the
#   same rationale as S110 below. Select it once those handlers narrow.
# - D (docstrings) / ANN (annotations): docstring coverage is a documentation
#   convention, and ANN restates what mypy already enforces at
#   disallow_untyped_defs. N (pep8-naming) has one standing hit, the
#   deliberate `bloodmoon_profile as B` alias in harness_common.py.
# The S (bandit) group is selected minus the two rules with standing,
# documented findings on this tree:
# - S110 (except-pass): teardown paths log-and-continue on purpose so a
#   failed cleanup never masks the real result.
# - S314 (xml parse): coverage_badge.py parses CI-generated Cobertura XML,
#   not untrusted input, and defusedxml would be a new dependency.
select = [
    "E",    # pycodestyle errors (incl. E501 at 100 via line-length)
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused bindings)
    "I",    # import order
    "A",    # flake8-builtins (shadowing builtins)
    "B",    # flake8-bugbear (bug-prone constructs)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (stale syntax)
    "FA",   # missing `from __future__ import annotations`
    "ISC",  # implicit string concatenation pitfalls
    "T10",  # debugger calls (a stray breakpoint() hangs CI harnesses)
    "DTZ",  # naive datetimes in measurement/log-parsing code
    "EXE",  # executable/shebang hygiene
    "S",    # flake8-bandit security rules (minus scoped ignores below)
    "SIM",  # simplifiable control flow (nested ifs, suppressable try/except/pass)
    "RET",  # return-value handling (useless assignments, unreachable returns)
    "PTH",  # pathlib over the os.path / os module equivalents
    "FURB", # refurb modernizations
    "RUF",  # ruff-specific (stale noqa directives, etc.)
    "PERF", # per-call loops that should be comprehensions
    "PIE",  # misc lints (misplaced conditionals, redundant parens)
    "RSE",  # unnecessary parentheses on raise
    "G",    # logging-format (%-args and f-strings in logging calls)
    "LOG",  # logging misuse
    "ARG",  # unused function arguments
    "ASYNC",  # blocking calls inside async def
    "PT",   # pytest style (fixture/parametrize hygiene)
    "TID",  # banned imports (relative-parent, crippled-encoding, etc.)
    "PGH",  # blanket noqa / type: ignore without a code
    "SLF",  # private member access
    "EM",   # exception messages built inline (assign, then raise)
    "ERA",  # commented-out code left in a script
    "FLY",  # static join/format strings better as f-strings
    "ICN",  # import alias hygiene (banned aliases, conventional names)
    "TRY",  # try/except/finally structure (misplaced else, useless finally)
    # Pylint, rule by rule rather than the whole PL band: the four rules left
    # out below fire on this tree and none of them carries defect signal here.
    # - PLR2004 (magic value) and PLR0912/PLR0915 (complexity) are readability
    #   rules, and the constants in question are selftest literals and badge
    #   thresholds spelled where they are read.
    # - PLC0415 (import not at top level): every hit is a `import tempfile`
    #   inside a --selftest, imported where it is used so the module stays
    #   importable without touching tempfile machinery.
    # - PLW2901 (loop variable overwritten): one hit, in a measurement loop
    #   that deliberately rebinds the bound before its next use.
    "PLC0206",  # dict iteration that only yields values
    "PLC0414",  # useless import alias
    "PLE1205",  # logging too many args / not enough args
    "PLE1206",  # logging too few args
    "PLR0402",  # manual from-import that should be an import statement
    "PLR1711",  # useless return
    "PLR1714",  # repeated equality comparison that should merge
    "PLR1716",  # chained comparison simplified by bool()
    "PLR1722",  # sys.exit / exit used instead of return
    "PLR1730",  # if-statement min/max simplification
    "PLR1736",  # unnecessary list index lookup
    "PLW0108",  # unnecessary lambda
    "PLW0120",  # useless else after return/raise/break/continue
    "PLW0177",  # comparison to NaN with ==
    "PLW0602",  # global variable never assigned
    "PLW0603",  # global statement assigning a value
    "PLW0604",  # global statement with no assignment
    "PLW0642",  # self-assignment of a method's own parameter
    "PLW1508",  # invalid envvar default that can never resolve
    "PLW1641",  # __eq__ implemented without __hash__
    "PLW2101",  # useless comparison between a value and itself
    "PLW3301",  # nested class that could be at module level
]

# Standing exceptions, each tied to a documented pattern above. Revisit when
# the underlying code changes.
ignore = [
    "S110",
    "S314",
    # TRY003 wants every exception message hoisted into a named exception
    # class. These are five one-shot CLI failures (missing config file, no
    # repository root, telnet never came up) that no caller catches and
    # re-raises under a different type, so a class per message would add
    # indirection without changing what a reader sees. The dynamic half of
    # the message is still built into a local first (EM102, enforced above).
    "TRY003",
]

[lint.per-file-ignores]
# harness_common inserts the sibling 7dtd-loadgen scripts dir into sys.path
# (for bloodmoon_profile, which exists only there) and imports the local
# es_cfg_guard in the same block. Those imports cannot be hoisted above the
# statement that makes the sibling module resolvable.
"scripts/harness_common.py" = ["E402"]
# The three live-server harnesses print their usage (and reject unknown
# arguments) before that import, so `--help` works on a checkout with no
# 7dtd-loadgen sibling. The import cannot move above the dispatch.
"scripts/measure_es_onoff.py" = ["E402"]
"scripts/validate_anim_path_admission.py" = ["E402"]
"scripts/validate_bloodmoon_path.py" = ["E402"]

