# Python lint gate, wired into `make test` and CI next to shellcheck.
# Line length mirrors .editorconfig's repo-wide 100-column cap.
line-length = 100

# Harness scripts import each other directly from scripts/.
src = ["scripts"]

[lint]
# Groups proven clean by a full run before being enabled here; a new group
# must pass on the tree before its selector lands. Deliberately not selected:
# - T20 (print): these are CLI harnesses; stdout is the product.
# - SIM / RET / PTH: style churn with no defect signal in this tree yet.
# - BLE (blind except): every hit is a teardown or quarantine boundary that
#   must log-and-continue so a failed cleanup never masks the real result, the
#   same rationale as S110 below. Select it once those handlers narrow.
# The S (bandit) group is selected minus the two rules with standing,
# documented findings on this tree:
# - S110 (except-pass): teardown paths log-and-continue on purpose so a
#   failed cleanup never masks the real result.
# - S314 (xml parse): coverage_badge.py parses CI-generated Cobertura XML,
#   not untrusted input, and defusedxml would be a new dependency.
select = [
    "E",    # pycodestyle errors (incl. E501 at 100 via line-length)
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused bindings)
    "I",    # import order
    "A",    # flake8-builtins (shadowing builtins)
    "B",    # flake8-bugbear (bug-prone constructs)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (stale syntax)
    "FA",   # missing `from __future__ import annotations`
    "ISC",  # implicit string concatenation pitfalls
    "T10",  # debugger calls (a stray breakpoint() hangs CI harnesses)
    "DTZ",  # naive datetimes in measurement/log-parsing code
    "EXE",  # executable/shebang hygiene
    "S",    # flake8-bandit security rules (minus scoped ignores below)
    "FURB", # refurb modernizations
    "RUF",  # ruff-specific (stale noqa directives, etc.)
    "PERF", # per-call loops that should be comprehensions
    "PIE",  # misc lints (misplaced conditionals, redundant parens)
    "RSE",  # unnecessary parentheses on raise
    "G",    # logging-format (%-args and f-strings in logging calls)
    "LOG",  # logging misuse
    "ARG",  # unused function arguments
    "ASYNC",  # blocking calls inside async def
    "PT",   # pytest style (fixture/parametrize hygiene)
    "TID",  # banned imports (relative-parent, crippled-encoding, etc.)
    "PGH",  # blanket noqa / type: ignore without a code
    "SLF",  # private member access
]

# Standing exceptions for the S band, each tied to a documented pattern
# above. Revisit when the underlying code changes.
ignore = [
    "S110",
    "S314",
]

[lint.per-file-ignores]
# harness_common inserts the sibling 7dtd-loadgen scripts dir into sys.path
# (for bloodmoon_profile, which exists only there) and imports the local
# es_cfg_guard in the same block. Those imports cannot be hoisted above the
# statement that makes the sibling module resolvable.
"scripts/harness_common.py" = ["E402"]

